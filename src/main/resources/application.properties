spring.application.name=batch-lab

# 使用内存 H2；重启应用后数据会清空，适合练习。
spring.datasource.url=jdbc:h2:mem:batchlab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# 让 Spring Batch 创建 BATCH_* 元数据表。
spring.batch.jdbc.initialize-schema=always

# 激活练习 1 (ex01) 的配置 Profile
spring.profiles.active=ex01

# 第一阶段只有一个 Job，允许应用启动时自动运行它。
spring.batch.job.enabled=true

logging.level.org.springframework.batch=INFO